name: RTL regression
on:
  push:
  pull_request:
jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y verilator make
      - run: pip install -r requirements.txt
      - run: make -C sim
      - run: make -C sim array
      - run: make -C sim tile
      - run: make -C sim buffer
      - run: make -C sim regs
      - run: make -C sim dfx
      - run: make -C sim benchmark
      - run: make -C sim double_buffered
      - run: make -C sim scheduler
      - run: make -C sim multitile
      - run: make -C sim addressing
      - run: make -C sim writeback
      - run: make -C sim writeback_sequencer
      - run: make -C sim iterator
      - run: make -C sim matrix_job
      - run: make -C sim matrix_integration
      - run: make -C sim operand_loader
      - run: make -C sim autoload
      - run: make -C sim operand_loader_sync
