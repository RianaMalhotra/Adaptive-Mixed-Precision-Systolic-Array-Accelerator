name: RTL regression
on:
  push:
  pull_request:
jobs:
  verilator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y verilator make
      - run: pip install -r requirements.txt
      - run: make -C sim
      - run: make -C sim array
      - run: make -C sim tile
      - run: make -C sim buffer
